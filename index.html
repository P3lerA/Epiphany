<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src file:">
  <title>Epiphany</title>
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
</head>
<body>
  <header>
    <h1><span class="t-lobby">Lobby</span><span class="t-projects">Projects</span><span class="t-settings">Settings</span></h1>
    <nav>
      <a href="#lobby">Lobby</a>
      <a href="#projects">Projects</a>
    </nav>
  </header>
  <main>
  <section id="lobby"></section>
  <section id="projects">
    <aside id="plist"></aside>
    <div id="pgrid"></div>
  </section>
  <section id="settings">
    <aside>
      <a href="#general">General</a>
      <a href="#profile">Profile</a>
      <a href="#sites">Sites</a>
      <a href="#instruments">Instruments</a>
    </aside>
    <div id="general">
      <h2>General</h2>
      <ul class="panel"><li><span>quote</span><select name="quote"></select></li><li><span>lookup</span><input type="checkbox" name="lookup"></li></ul>
    </div>
    <div id="profile">
      <h2>Profile</h2>
      <select></select>
      <ul class="panel"></ul>
      <p class="hint">{{tags}} {{artist}} {{character}} {{copyright}} {{rating}} {{score}}</p>
    </div>
    <div id="sites">
      <h2>Sites</h2>
      <ul class="panel"></ul>
    </div>
    <div id="instruments">
      <h2>Instruments</h2>
      <ul class="panel"></ul>
    </div>
  </section>
  </main>
  <div class="fab">
    <div class="search"><select name="scope"><option value="">local</option></select><input type="search" name="q" placeholder="search" spellcheck="false"></div>
    <button class="theme-toggle" aria-label="Toggle theme"></button>
    <button class="filter-toggle" aria-label="Filters"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4 2v-8z"/></svg></button>
    <a href="#general" aria-label="Settings"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></a>
  </div>
  <div id="filters" hidden>
    <label><input type="checkbox" name="ai" checked> AI</label>
    <div class="seg" data-name="rating"><button value="g">general</button><button value="gs">sensitive</button><button value="">any</button></div>
    <div class="seg" data-name="tagged"><button value="booru">booru</button><button value="other">other</button><button value="none">none</button><button value="">any</button></div>
    <select name="site"><option value="">All sources</option></select>
  </div>
  <div id="toast" hidden></div>
  <dialog id="preview">
    <figure>
      <button class="nav prev" aria-label="Previous"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <img>
      <button class="nav next" aria-label="Next"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </figure>
    <aside>
      <textarea spellcheck="false"></textarea>
      <div class="meta">
        <a href="#projects" class="proj"></a>
        <span class="name"></span>
        <span class="time"></span>
        <span class="rating"></span>
        <a href="#" class="src"></a>
      </div>
    </aside>
  </dialog>
  <script src="renderer.js"></script>
</body>
</html>
