<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; }
    a { color: #A48D6F; } a:hover { color: #EDE5D6; }
  </style>
</helmet>
<div style="width: 1200px; height: 760px; box-sizing: border-box; padding: 0 28px 28px; background: {{t.bg}}; color: {{t.fg}}; font-family: Figtree, 'Segoe UI Variable Text', 'Segoe UI', 'Noto Sans SC', sans-serif; font-size: 14px; line-height: 1.5; overflow: hidden; display: flex; flex-direction: column; gap: 8px;">
  <div style="display: flex; align-items: center; justify-content: space-between; height: 68px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <div style="font-size: 22px; font-weight: 700; letter-spacing: -0.01em;">Epiphany</div>
      <div style="width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid {{t.fg}}; background: {{t.dot}};"></div>
    </div>
    <div style="display: flex; gap: 4px; font-weight: 500;">
      <div style="padding: 9px 20px; border-radius: 999px; background: {{t.tonal}};">Lobby</div>
      <div style="padding: 9px 20px; border-radius: 999px; color: {{t.muted}};">Settings</div>
    </div>
  </div>
  <div style="display: flex; align-items: baseline; gap: 12px; padding: 4px 4px 12px;">
    <div style="font-size: 26px; font-weight: 700; letter-spacing: -0.01em;">Lobby</div>
    <div style="color: {{t.muted}};">12 pictures</div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px;">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="12">
      <div style="aspect-ratio: 1; border-radius: 12px; background: {{item.c}};"></div>
    </sc-for>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? true
    const t = dark
      ? { bg: '#0F0F1A', fg: '#EDE5D6', muted: '#8B7E5E', rule: '#2A2A3E', link: '#A48D6F', surface: '#17172A', tonal: '#2E2733', dot: '#EDE5D6' }
      : { bg: '#F4ECD8', fg: '#1A1A2E', muted: '#7A6F5C', rule: '#D4CCB8', link: '#8C5A2B', surface: '#ECE3CC', tonal: '#DDCBB4', dot: 'transparent' }
    const tones = ['#C9B79C', '#5B6B7A', '#8C5A2B', '#A48D6F', '#3E4A5C', '#7A6F5C', '#D4CCB8', '#2A2A3E', '#B08968', '#6B7B8C', '#9C8C74', '#4A4A5E']
    return { t, items: tones.map(c => ({ c })) }
  }
}
</script>
</body>
</html>
