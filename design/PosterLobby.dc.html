<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;900&display=swap">
  <style>
    body { margin: 0; }
    a { color: #A48D6F; } a:hover { color: #EDE5D6; }
  </style>
</helmet>
<div style="width: 1200px; height: 760px; box-sizing: border-box; padding: 32px 40px 40px; background: {{t.bg}}; color: {{t.fg}}; font-family: Archivo, 'Segoe UI Black', 'Segoe UI', 'Noto Sans SC', sans-serif; font-size: 14px; line-height: 1.4; overflow: hidden; display: flex; flex-direction: column; gap: 24px;">
  <div style="display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 20px; border-bottom: 3px solid {{t.fg}};">
    <div style="display: flex; align-items: baseline; gap: 14px;">
      <div style="font-size: 72px; font-weight: 900; line-height: 0.9; letter-spacing: -0.05em; text-transform: uppercase;">Epiphany</div>
      <div style="width: 18px; height: 18px; border-radius: 50%; border: 3px solid {{t.fg}}; background: {{t.dot}};"></div>
    </div>
    <div style="display: flex; gap: 8px; font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;">
      <div style="padding: 10px 18px; background: {{t.fg}}; color: {{t.bg}};">Lobby</div>
      <div style="padding: 10px 18px; border: 2px solid {{t.fg}};">Settings</div>
    </div>
  </div>
  <div style="display: flex; align-items: baseline; justify-content: space-between; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;">
    <div>12 pictures</div>
    <div style="color: {{t.muted}};">Newest first</div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 3px; padding: 3px; background: {{t.fg}};">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="12">
      <div style="aspect-ratio: 1; background: {{item.c}};"></div>
    </sc-for>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":1200,"height":760}}'>
class Component extends DCLogic {
  renderVals() {
    const dark = this.props.dark ?? true
    const t = dark
      ? { bg: '#0F0F1A', fg: '#EDE5D6', muted: '#8B7E5E', rule: '#2A2A3E', link: '#A48D6F', dot: '#EDE5D6' }
      : { bg: '#F4ECD8', fg: '#1A1A2E', muted: '#7A6F5C', rule: '#D4CCB8', link: '#8C5A2B', dot: 'transparent' }
    const tones = ['#C9B79C', '#5B6B7A', '#8C5A2B', '#A48D6F', '#3E4A5C', '#7A6F5C', '#D4CCB8', '#2A2A3E', '#B08968', '#6B7B8C', '#9C8C74', '#4A4A5E']
    return { t, items: tones.map(c => ({ c })) }
  }
}
</script>
</body>
</html>
